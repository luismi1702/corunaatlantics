<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlantics · Gestión</title>
  <meta name="description" content="Consola de gestión del Coruña Atlantics.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#040d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlantics">
  <link rel="apple-touch-icon" href="./icons/icono-192.png">

  <!-- Lo que el navegador puede cargar, y de donde. Con todo el codigo servido
       desde aqui, un script ajeno no se ejecuta ni aunque alguien consiga
       colarlo en la pagina. Las fuentes son de Google y las fotos de la tienda
       de Supabase: lo demas, de casa.
       Ojo al tocarlo: los atributos style="" del HTML necesitan
       'unsafe-inline' en style-src, y quitarlo deja la app sin maquetar.
       No lleva frame-ancestors: en un <meta> el navegador lo ignora y solo
       vale como cabecera, que en GitHub Pages no se puede poner. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: blob: https://*.supabase.co;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co;
    base-uri 'none';
    form-action 'none';
    object-src 'none'">

  <link rel="stylesheet" href="./fonts/fuentes.css">

  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <!-- La marca de la pantalla. Va fuera de #app y no como pseudoelemento suyo
       porque #app es un contenedor flex: un ::before ahi seria un hijo mas y
       empujaria el contenido. Vacia y oculta salvo en las pantallas que tienen
       una asignada. -->
  <div class="marca-pantalla" aria-hidden="true"></div>

  <div id="app">
    <div class="cargando"><div class="spinner"></div></div>
  </div>
  <div id="avisos"></div>

  <noscript>
    <p style="padding:2rem;text-align:center">
      Esta app necesita JavaScript activado.
    </p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
